name: "Build release"

on:
  push:
    tags:
      - app/v*.*.*

jobs:
  build:
    name: Build
    runs-on: [self-hosted, cronet, linux-cronet]
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always --match 'app/v*' | sed -n 's|app/\([^/-]*\)\(-.*\)\{0,1\}|\1|p')" >> $GITHUB_OUTPUT

      - name: Prepare persistent Go cache
        run: |
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" prepare-go \
            --workspace "$GITHUB_WORKSPACE" --slot "hysteria-release" --env-file "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Run build script
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export HY_APP_PLATFORMS=$(sed 's/\r$//' platforms.txt | awk '!/^#/ && !/^$/' | paste -sd ",")
          uv run python hyperbole.py build -r

      - name: Generate hashes
        run: |
          for file in build/*; do
            sha256sum $file >> build/hashes.txt
          done

      - name: Upload GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: build/*

      - name: Retain successful build and prune obsolete Go cache
        run: |
          set -euo pipefail
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" publish \
            --root "$HOME/.local/share/pandafan-ci/artifacts" --slot "hysteria-release" build/*
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" go \
            --cache "$GOCACHE" --modules "$GOMODCACHE" --started "$CI_GO_STARTED" --slot "$CI_GO_SLOT" \
            --source "$GITHUB_WORKSPACE" --source "$RUNNER_TEMP" --apply
