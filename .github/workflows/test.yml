name: "Tests"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        # Precompile bytecode (as pip did by default) so the Python test
        # helpers start fast enough for the Go tests' server-startup wait.
        run: uv sync
        env:
          UV_COMPILE_BYTECODE: "1"

      - name: Activate Python environment
        # The Go tests spawn the Python helpers via bare `python`, so put the
        # uv-managed virtualenv on PATH for the steps that follow.
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Add Python wrapper for Go tests
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/python <<EOF
          #!/bin/bash
          export LD_LIBRARY_PATH="${Python_ROOT_DIR}/lib:\${LD_LIBRARY_PATH:-}"
          exec "${Python_ROOT_DIR}/bin/python" "\$@"
          EOF
          chmod +x .ci-bin/python
          echo "$PWD/.ci-bin" >> $GITHUB_PATH

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check format
        run: python hyperbole.py format-check

      - name: Test core
        working-directory: core
        run: go test -v -count=1 -skip 'Stress' ./...

      - name: Test extras
        working-directory: extras
        run: go test -v -count=1 ./...

      - name: Test app
        working-directory: app
        run: go test -v -count=1 ./...

  test-push:
    name: Test push
    if: github.event_name == 'push'
    runs-on: [self-hosted, cronet, linux-cronet]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync
        env:
          UV_COMPILE_BYTECODE: "1"

      - name: Activate Python environment
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Add Python wrapper for Go tests
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/python <<EOF
          #!/bin/bash
          export LD_LIBRARY_PATH="${Python_ROOT_DIR}/lib:\${LD_LIBRARY_PATH:-}"
          exec "${Python_ROOT_DIR}/bin/python" "\$@"
          EOF
          chmod +x .ci-bin/python
          echo "$PWD/.ci-bin" >> $GITHUB_PATH

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check format
        run: python hyperbole.py format-check

      - name: Test core
        working-directory: core
        run: go test -v -count=1 -skip 'Stress' ./...

      - name: Test extras
        working-directory: extras
        run: go test -v -count=1 ./...

      - name: Test app
        working-directory: app
        run: go test -v -count=1 ./...
