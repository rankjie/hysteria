name: "Build common"

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: [self-hosted, cronet, linux-cronet]
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    outputs:
      files: ${{ steps.list-files.outputs.files }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare persistent Go cache
        run: |
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" prepare-go \
            --workspace "$GITHUB_WORKSPACE" --slot "hysteria-build-common" --env-file "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Setup uv # This is for the build script
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Run build script
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export HY_APP_PLATFORMS=$(sed 's/\r$//' platforms.txt | awk '!/^#/ && !/^$/' | paste -sd ",")
          uv run python hyperbole.py build -r

      - name: Generate hashes
        run: |
          for file in build/*; do
            sha256sum $file >> build/hashes.txt
          done

      - name: List build files
        id: list-files
        run: |
          files=$(ls -1 build/ | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Upload build directory
        uses: actions/upload-artifact@v7
        with:
          name: build-temp-${{ github.sha }}
          path: build/

      - name: Retain successful build and prune obsolete Go cache
        run: |
          set -euo pipefail
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" publish \
            --root "$HOME/.local/share/pandafan-ci/artifacts" --slot "hysteria-build-common" build/*
          env -i PATH="$PATH" python3 "$HOME/.local/lib/pandafan-ci/retention.py" go \
            --cache "$GOCACHE" --modules "$GOMODCACHE" --started "$CI_GO_STARTED" --slot "$CI_GO_SLOT" \
            --source "$GITHUB_WORKSPACE" --source "$RUNNER_TEMP" --apply

  upload:
    name: Upload ${{ matrix.file }}
    needs: build
    runs-on: [self-hosted, cronet, linux-cronet]
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.build.outputs.files) }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build-temp-${{ github.sha }}

      - name: Upload ${{ matrix.file }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
